# Home media server stack for Docker Desktop on Windows (WSL2 backend).
#
# Adapted from https://github.com/akitaonrails/plex_home_server_docker
# Key differences from the original Linux/NAS setup are documented in README.md:
#   - one single /data mount per container instead of separate /downloads + /movies + /tv
#   - no /dev/dri passthrough (does not exist on Windows), no network_mode: host
#   - forward-slash paths in .env (C:/media, not C:\media)
#
# Profiles:
#   default    -> qbittorrent prowlarr sonarr radarr lidarr bazarr jellyfin jellyseerr komga kavita
#   plex       -> Plex Media Server instead of / alongside Jellyfin
#   usenet     -> SABnzbd
#   utils      -> Portainer, Watchtower
#   flaresolverr -> FlareSolverr, as a Prowlarr indexer proxy

name: homeserver

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Stockholm}
  UMASK: ${UMASK:-002}

x-restart: &restart
  restart: unless-stopped

networks:
  homeserver:
    name: homeserver
    driver: bridge

services:
  # ---------------------------------------------------------------- downloaders
  qbittorrent:
    <<: *restart
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    networks: [homeserver]
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${QBT_TORRENT_PORT:-6881}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${QBT_WEBUI_PORT:-8080}:8080"
      - "${QBT_TORRENT_PORT:-6881}:${QBT_TORRENT_PORT:-6881}/tcp"
      - "${QBT_TORRENT_PORT:-6881}:${QBT_TORRENT_PORT:-6881}/udp"

  sabnzbd:
    <<: *restart
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    profiles: [usenet]
    networks: [homeserver]
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${SABNZBD_PORT:-8085}:8080"

  # ------------------------------------------------------------------ indexers
  # Cloudflare challenge solver, reached by Prowlarr as an indexer proxy. Opt-in
  # because it is the heaviest thing in the stack: every request it handles
  # launches a real browser, so a tagged indexer costs seconds and hundreds of
  # MB where an untagged one costs a HTTP call.
  #
  # Not a LinuxServer image, so *common-env does not apply - it takes no
  # PUID/PGID/UMASK and keeps no state, which is why it has no /config volume.
  flaresolverr:
    <<: *restart
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    profiles: [flaresolverr]
    networks: [homeserver]
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"

  prowlarr:
    <<: *restart
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks: [homeserver]
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"

  # ----------------------------------------------------------------- librarians
  sonarr:
    <<: *restart
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks: [homeserver]
    depends_on: [qbittorrent]
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${SONARR_PORT:-8989}:8989"

  radarr:
    <<: *restart
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks: [homeserver]
    depends_on: [qbittorrent]
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${RADARR_PORT:-7878}:7878"

  lidarr:
    <<: *restart
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    networks: [homeserver]
    depends_on: [qbittorrent]
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${LIDARR_PORT:-8686}:8686"

  bazarr:
    <<: *restart
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks: [homeserver]
    depends_on: [sonarr, radarr]
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${BAZARR_PORT:-6767}:6767"

  # -------------------------------------------------------------------- players
  jellyfin:
    <<: *restart
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks: [homeserver]
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: http://${HOST_IP:-localhost}:${JELLYFIN_PORT:-8096}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media:ro
      - ${CACHE_ROOT:-./cache}/jellyfin-transcode:/config/transcode
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    # NVIDIA NVENC only. Requires a current NVIDIA driver on Windows + WSL2 GPU support.
    # Intel QuickSync / VAAPI is NOT available to containers on Windows: there is no /dev/dri.
    # Uncomment to enable, then set hardware acceleration to NVENC in Jellyfin.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  plex:
    <<: *restart
    image: plexinc/pms-docker:latest
    container_name: plex
    profiles: [plex]
    networks: [homeserver]
    environment:
      <<: *common-env
      # network_mode: host is unavailable on Docker Desktop for Windows, so GDM
      # auto-discovery does not work. ADVERTISE_IP + a claim token replace it.
      ADVERTISE_IP: http://${HOST_IP:-localhost}:32400/
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      PLEX_UID: ${PUID:-1000}
      PLEX_GID: ${PGID:-1000}
    volumes:
      - ${CONFIG_ROOT}/plex:/config
      - ${DATA_ROOT}/media:/data/media:ro
      - ${CACHE_ROOT:-./cache}/plex-transcode:/transcode
    ports:
      - "32400:32400"
      - "3005:3005"
      - "8324:8324"
      - "32469:32469"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    # See the NVENC note on jellyfin above.

  jellyseerr:
    <<: *restart
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    networks: [homeserver]
    depends_on: [sonarr, radarr]
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      PORT: 5055
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"

  # Seerr is the successor to Overseerr and Jellyseerr, so this overlaps with
  # jellyseerr above on purpose and temporarily - both are running so they can be
  # compared before one is dropped. They cannot share port 5055, hence 5056.
  #
  # No PUID/PGID: unlike the linuxserver images this one runs as its own `node`
  # user at UID 1000 and wants the config directory owned by it. On a Docker
  # Desktop bind mount that ownership is largely ignored, which is why nothing
  # here chowns anything - but it is the reason this service looks different.
  seerr:
    <<: *restart
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    networks: [homeserver]
    depends_on: [sonarr, radarr]
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      PORT: 5055
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    ports:
      - "${SEERR_PORT:-5056}:5055"

  # --------------------------------------------------------- comics / manga / books
  komga:
    <<: *restart
    image: ghcr.io/gotson/komga:latest
    container_name: komga
    networks: [homeserver]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - ${CONFIG_ROOT}/komga:/config
      - ${DATA_ROOT}/media/comics:/data/comics
      - ${DATA_ROOT}/media/manga:/data/manga
      - ${DATA_ROOT}/media/books:/data/books
    ports:
      - "${KOMGA_PORT:-25600}:25600"

  kavita:
    <<: *restart
    image: jvmilazz0/kavita:latest
    container_name: kavita
    networks: [homeserver]
    environment:
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - ${CONFIG_ROOT}/kavita:/kavita/config
      - ${DATA_ROOT}/media/manga:/manga
      - ${DATA_ROOT}/media/comics:/comics
      - ${DATA_ROOT}/media/books:/books
    ports:
      - "${KAVITA_PORT:-5001}:5000"

  # The manga downloader. Built from docker/aio/Dockerfile because upstream
  # publishes no image, and behind its own profile because it is not a service:
  # it has no port, nothing listens, and it exists to be run one command at a
  # time.
  #
  #     docker compose --profile manga build aio
  #     docker compose --profile manga run --rm aio --search "Dandadan" --auto-pick
  #
  # Get-MangaChapters.ps1 wraps that second line, and is the intended way in.
  aio:
    profiles: [manga]
    build:
      context: ./docker/aio
    image: homeserver/aio:latest
    container_name: aio
    networks: [homeserver]
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      # Writes ComicInfo.xml with tags and a description, and caches the
      # matched AniList and MAL ids so a re-run skips the fuzzy title match.
      AIO_METADATA_SOURCE: ${AIO_METADATA_SOURCE:-anilist}
    volumes:
      # The same path Komga mounts as /data/manga and Kavita as /manga, so a
      # finished CBZ is already in the library - no move, no second copy.
      - ${DATA_ROOT}/media/manga:/data/manga
      - ${CONFIG_ROOT}/aio:/config

  # ---------------------------------------------------------------- dashboard
  homepage:
    <<: *restart
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks: [homeserver]
    environment:
      <<: *common-env
      # Required since v1.0 or the page refuses to render. Must list every
      # host:port you will open it from.
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000}
      # Referenced as {{HOMEPAGE_VAR_*}} inside services.yaml so credentials
      # stay in .env instead of the config files.
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY:-}
      # Komga and Kavita each accept an API key instead of a login, and those
      # keys already exist in .env for Import-MangaLists.ps1 - so they are
      # forwarded under the HOMEPAGE_VAR_ prefix Homepage requires rather than
      # asking you to paste the same secret into a second variable.
      HOMEPAGE_VAR_KOMGA_KEY: ${KOMGA_API_KEY:-}
      HOMEPAGE_VAR_KAVITA_KEY: ${KAVITA_API_KEY:-}
      HOMEPAGE_VAR_KOMGA_USER: ${HOMEPAGE_VAR_KOMGA_USER:-}
      HOMEPAGE_VAR_KOMGA_PASSWORD: ${HOMEPAGE_VAR_KOMGA_PASSWORD:-}
      HOMEPAGE_VAR_KAVITA_USER: ${HOMEPAGE_VAR_KAVITA_USER:-}
      HOMEPAGE_VAR_KAVITA_PASSWORD: ${HOMEPAGE_VAR_KAVITA_PASSWORD:-}
      # qBittorrent 5.2+ can issue an API key, which the widget takes instead of
      # a login. Unlike Komga and Kavita there is no existing .env key to
      # forward, so this one is its own variable.
      HOMEPAGE_VAR_QBT_KEY: ${HOMEPAGE_VAR_QBT_KEY:-}
      HOMEPAGE_VAR_QBT_USER: ${HOMEPAGE_VAR_QBT_USER:-admin}
      HOMEPAGE_VAR_QBT_PASSWORD: ${HOMEPAGE_VAR_QBT_PASSWORD:-}
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"

  # ---------------------------------------------------------------------- utils
  portainer:
    <<: *restart
    image: portainer/portainer-ce:latest
    container_name: portainer
    profiles: [utils]
    networks: [homeserver]
    volumes:
      - portainer_data:/data
      # Docker Desktop exposes the engine socket inside WSL2 at this path.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${PORTAINER_PORT:-9000}:9000"

  watchtower:
    <<: *restart
    image: containrrr/watchtower:latest
    container_name: watchtower
    profiles: [utils]
    networks: [homeserver]
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_LABEL_ENABLE: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  portainer_data:
